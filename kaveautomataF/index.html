<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kávéautomata</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Enjoy your coffee!</h1>
    <div id="content" class="content">
        <div id="automata">
            <div id="banner"></div>
            <div id="kijelzo">0 Ft</div>
            <button onclick="valasztas('Eszpresszó', 300)">Eszpresszó (300 Ft)</button>
            <button onclick="valasztas('Americano', 350)">Americano (350 Ft)</button>
            <button onclick="valasztas('Hosszú kávé', 300)">Hosszú kávé (300 Ft)</button>
            <button onclick="valasztas('Cappuccino', 320)">Cappuccino (320 Ft)</button>
            <button onclick="valasztas('Tejes kávé', 350)">Tejes kávé (350 Ft)</button>
            
            <div id="bedobo-rekesz"></div>
            
            <div id="kave-rekesz">
                <div class="coffee-loader">
                    <div class="cup">
                        <div class="coffee-empty"></div>
                    </div>                    
                </div>
            </div>
            <div id="visszajaro-rekesz" onclick="kiveszVisszajaro()">Rekesz</div>
        </div>

        <div id="penztarca">
            <h3>Pénztárca</h3>
            <p id="penztarca-ertek">825 Ft</p>
            <div class="erme" onclick="bedob(5)" draggable="true">5</div>
            <div class="erme" onclick="bedob(10)" draggable="true">10</div>
            <div class="erme" onclick="bedob(20)" draggable="true">20</div>
            <div class="erme" onclick="bedob(50)" draggable="true">50</div>
            <div class="erme" onclick="bedob(100)" draggable="true">100</div>
            <div class="erme" onclick="bedob(200)" draggable="true">200</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
